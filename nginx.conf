server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Always revalidate the page so new schedules show up right away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed bundles here
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Schedule images keep the same name forever, but revalidate daily
    location ~* \.jpe?g$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
